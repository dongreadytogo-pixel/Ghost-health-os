<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0d0b1a" />
    <title>Project Titan — Idle MMORPG</title>
    <style>
      :root {
        --bg: #0d0b1a;
        --panel: #1a1730;
        --panel2: #242042;
        --ink: #e8e6f2;
        --muted: #9b96c4;
        --accent: #ffd166;
        --hp: #ef476f;
        --xp: #06d6a0;
        --enemy: #f78c6b;
        --common: #b8b8c8;
        --uncommon: #5fd35f;
        --rare: #4aa3ff;
        --epic: #b06bff;
        --legendary: #ffa630;
        --mythic: #ff4d6d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, "Courier New", monospace;
        -webkit-font-smoothing: none;
        image-rendering: pixelated;
        touch-action: manipulation;
      }
      body { display: flex; justify-content: center; }
      #app {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel {
        background: var(--panel);
        border: 2px solid #36315e;
        border-radius: 10px;
        padding: 10px;
      }
      header { display: flex; align-items: center; gap: 8px; }
      header h1 {
        font-size: 14px;
        margin: 0;
        letter-spacing: 1px;
        color: var(--accent);
        flex: 1;
      }
      .pill {
        background: var(--panel2);
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        white-space: nowrap;
      }
      .bar {
        position: relative;
        height: 14px;
        background: #00000055;
        border-radius: 7px;
        overflow: hidden;
        border: 1px solid #ffffff14;
      }
      .bar > span {
        position: absolute;
        inset: 0;
        transform-origin: left;
        transition: transform 0.12s linear;
      }
      .bar > b {
        position: absolute;
        inset: 0;
        text-align: center;
        font-size: 10px;
        line-height: 14px;
        color: #fff;
        text-shadow: 0 1px 0 #0008;
      }
      .hp > span { background: linear-gradient(var(--hp), #c1304e); }
      .xp > span { background: linear-gradient(var(--xp), #04a47a); }
      .enemyhp > span { background: linear-gradient(var(--enemy), #d96a4a); }

      .scene {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: end;
        gap: 6px;
        position: relative;
        min-height: 150px;
        background:
          linear-gradient(#1d1838, #14112a 70%, #0e0b1f);
        overflow: hidden;
      }
      .ground {
        position: absolute;
        left: 0; right: 0; bottom: 36px;
        height: 2px;
        background: #ffffff12;
      }
      .fighter { text-align: center; z-index: 2; }
      .sprite {
        font-size: 52px;
        line-height: 1;
        filter: drop-shadow(0 4px 0 #0006);
        display: inline-block;
      }
      .sprite.hero.attacking { animation: lunge-r 0.25s ease; }
      .sprite.enemy.attacking { animation: lunge-l 0.25s ease; }
      .sprite.hit { animation: hit 0.2s ease; }
      @keyframes lunge-r { 50% { transform: translateX(14px); } }
      @keyframes lunge-l { 50% { transform: translateX(-14px); } }
      @keyframes hit { 50% { filter: brightness(3) drop-shadow(0 0 6px #fff); transform: translateX(4px); } }
      .fighter .name { font-size: 11px; margin: 4px 0 3px; color: var(--muted); }
      .mount { font-size: 11px; color: var(--accent); }
      .vs { color: var(--muted); font-size: 12px; align-self: center; }

      .dmg {
        position: absolute;
        font-size: 15px;
        font-weight: bold;
        pointer-events: none;
        z-index: 5;
        animation: float 0.8s ease-out forwards;
        text-shadow: 0 1px 2px #000;
      }
      .dmg.crit { font-size: 21px; color: var(--accent); }
      .dmg.skill { color: #6bd3ff; }
      .dmg.heal { color: var(--xp); }
      .dmg.miss { color: var(--muted); }
      @keyframes float {
        0% { opacity: 1; transform: translateY(0) scale(0.8); }
        20% { transform: translateY(-6px) scale(1.1); }
        100% { opacity: 0; transform: translateY(-40px) scale(1); }
      }

      .row-title { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; }
      #party, #gear { display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px; }
      .empty { color: var(--muted); font-size: 11px; }
      .chip .up { color: var(--xp); font-size: 10px; }
      .chip {
        font-size: 11px;
        padding: 4px 7px;
        border-radius: 7px;
        background: var(--panel2);
        border-left: 4px solid var(--common);
        display: flex; gap: 5px; align-items: center;
      }
      .chip .bond { color: var(--accent); font-size: 10px; }
      .r-common { border-color: var(--common); }
      .r-uncommon { border-color: var(--uncommon); }
      .r-rare { border-color: var(--rare); }
      .r-epic { border-color: var(--epic); }
      .r-legendary { border-color: var(--legendary); }
      .r-mythic { border-color: var(--mythic); box-shadow: 0 0 8px #ff4d6d55; }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
      .stat b { display: block; font-size: 16px; color: var(--accent); }
      .stat span { font-size: 10px; color: var(--muted); }

      #log {
        height: 130px;
        overflow-y: auto;
        font-size: 11px;
        line-height: 1.6;
        display: flex;
        flex-direction: column-reverse;
      }
      #log div { border-bottom: 1px solid #ffffff08; padding: 1px 0; }
      .log-kill { color: var(--xp); }
      .log-level { color: var(--accent); font-weight: bold; }
      .log-join { color: var(--rare); }
      .log-fuse { color: var(--epic); font-weight: bold; }
      .log-shiny { color: var(--mythic); font-weight: bold; }
      .log-defeat { color: var(--hp); }

      .controls { display: flex; gap: 8px; }
      button {
        flex: 1;
        font-family: inherit;
        font-size: 12px;
        padding: 9px;
        border-radius: 8px;
        border: 2px solid #36315e;
        background: var(--panel2);
        color: var(--ink);
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
      .footer { font-size: 10px; color: var(--muted); text-align: center; }

      /* Welcome-back modal */
      #welcome {
        position: fixed; inset: 0;
        background: #000a;
        display: none;
        align-items: center; justify-content: center;
        z-index: 20; padding: 20px;
      }
      #welcome.show { display: flex; }
      #welcome .box { background: var(--panel); border: 2px solid #36315e; border-radius: 12px; padding: 18px; max-width: 340px; width: 100%; }
      #welcome h2 { margin: 0 0 10px; font-size: 15px; color: var(--accent); }
      #welcome p { font-size: 12px; line-height: 1.7; margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="panel">
        <h1>⚔ PROJECT TITAN</h1>
        <span class="pill">Lv <b id="level">1</b></span>
        <span class="pill">💰 <b id="gold">0</b></span>
      </header>

      <div class="panel">
        <div class="row-title">EXP</div>
        <div class="bar xp"><span id="xpfill"></span><b id="xptext"></b></div>
      </div>

      <div class="panel scene">
        <div class="ground"></div>
        <div class="fighter">
          <canvas class="sprite hero" id="hero-canvas" width="64" height="80"></canvas>
          <div class="name">ฮีโร่</div>
          <div class="bar hp"><span id="hero-hp"></span></div>
          <div class="mount" id="hero-mount"></div>
        </div>
        <div class="vs">VS</div>
        <div class="fighter">
          <canvas class="sprite enemy" id="enemy-canvas" width="64" height="80"></canvas>
          <div class="name" id="enemy-name">…</div>
          <div class="bar enemyhp"><span id="enemy-hp"></span></div>
        </div>
      </div>

      <div class="panel">
        <div class="row-title">⚔ อุปกรณ์ (ใส่/อัปเกรดอัตโนมัติ)</div>
        <div id="gear"></div>
      </div>

      <div class="panel">
        <div class="row-title">ทีมเพื่อน (จับมาได้) · <span id="roster-count">0</span> ตัว</div>
        <div id="party"></div>
      </div>

      <div class="panel stats">
        <div class="stat"><b id="kills">0</b><span>ฆ่าทั้งหมด</span></div>
        <div class="stat"><b id="items">0</b><span>ไอเทม</span></div>
        <div class="stat"><b id="shinies">0</b><span>✦ shiny</span></div>
      </div>

      <div class="panel">
        <div class="row-title">บันทึกการผจญภัย</div>
        <div id="log"></div>
      </div>

      <div class="controls">
        <button id="mute">🔊 เสียง</button>
        <button id="pause">⏸ หยุด</button>
        <button id="reset">🗑 เริ่มใหม่</button>
      </div>

      <div class="footer">
        Idle MMORPG · เล่นอัตโนมัติ · เซฟอัตโนมัติ · เพลง BG เพิ่มภายหลัง
      </div>
    </div>

    <div id="welcome">
      <div class="box">
        <h2>✨ ยินดีต้อนรับกลับ!</h2>
        <div id="welcome-body"></div>
        <button id="welcome-ok" style="margin-top:12px">เยี่ยม!</button>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
