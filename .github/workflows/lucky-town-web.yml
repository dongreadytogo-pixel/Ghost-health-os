name: Lucky Town Web Build

# Exports the Godot game to HTML5 and publishes it to GitHub Pages so it can be
# played in a phone browser (e.g. iPhone Safari). Scoped to the game folder.
#
# ONE-TIME SETUP (do this on github.com, also works from the mobile site):
#   Repo → Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# After the first successful run, the play URL appears on the Pages settings
# page and in this workflow's run summary.
#
# Export is delegated to the well-maintained firebelley/godot-export action,
# which installs Godot + export templates and handles the headless import/export
# quirks (e.g. the opaque "configuration errors") reliably.

on:
  push:
    branches: ['**']
    paths: ['lucky-town/**', '.github/workflows/lucky-town-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lucky-town-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # firebelley/godot-export prefers a clean checkout; fetch full history
          # is not needed, but the default single-commit checkout is fine.
          fetch-depth: 1

      - name: Export Godot project (Web preset)
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./lucky-town
          archive_output: false
          cache: false

      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          echo "Export build directory: $BUILD_DIR"
          echo "----- contents -----"
          ls -R "$BUILD_DIR"
          echo "--------------------"
          mkdir -p _site
          # Find the exported index.html wherever the action placed it and copy
          # its whole directory to the Pages root — robust to layout changes.
          INDEX="$(find "$BUILD_DIR" -name index.html | head -n1)"
          test -n "$INDEX"
          echo "Found web export at: $INDEX"
          cp -r "$(dirname "$INDEX")/." _site/
          test -f _site/index.html
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
