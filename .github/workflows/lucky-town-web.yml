name: Lucky Town Web Build

# Exports the Godot game to HTML5 and publishes it to GitHub Pages so it can be
# played in a phone browser (e.g. iPhone Safari). Scoped to the game folder.
#
# ONE-TIME SETUP (do this on github.com, also works from the mobile site):
#   Repo → Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# After the first successful run, the play URL appears on the Pages settings
# page and in this workflow's run summary.

on:
  push:
    branches: ['**']
    paths: ['lucky-town/**', '.github/workflows/lucky-town-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lucky-town-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.2.2
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/* "$TEMPLATE_DIR/"
          godot --version

      - name: Import project — TWO passes (build the global class cache)
        working-directory: lucky-town
        # On a fresh checkout Godot's global_script_class_cache.cfg doesn't exist,
        # so scripts that reference other scripts' class_name types can't resolve
        # them on the first import (chicken-and-egg). Pass 1 registers every
        # class_name; pass 2 resolves cleanly. Broken autoloads are exactly what
        # makes the subsequent export report a detail-less "configuration error".
        run: |
          godot --headless --import 2>&1 | tail -n 5 || true
          godot --headless --import 2>&1 | tail -n 5 || true

      - name: Export Web build
        working-directory: lucky-town
        run: |
          set -uo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          echo "Export templates present:"; ls -la "$TEMPLATE_DIR"
          mkdir -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html > export.log 2>&1 || true
          echo "===== export.log: error lines ====="
          grep -iE "error|cannot|fail|missing" export.log | tail -n 40 || true
          echo "===== export.log: tail ====="
          tail -n 30 export.log
          echo "============================"
          test -f build/web/index.html
          ls -la build/web

      # Single-threaded Web preset (variant/thread_support=false) → runs on
      # GitHub Pages and mobile Safari without SharedArrayBuffer / COOP-COEP.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lucky-town/build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
