name: Studio CI (Swift)

on:
  push:
    branches: ['**']
    paths:
      - 'studio/**'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-ci.yml'

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-test:
    name: Linux build & test (engines, MCP, CLI)
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build --build-tests

      - name: Test
        run: swift test --parallel

      - name: Build executables (release)
        run: |
          swift build -c release --product ghostly
          swift build -c release --product ghostly-mcp-server

      - name: Install ffmpeg (one-click auto smoke)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg

      - name: Smoke-test CLI
        run: |
          BIN=$(swift build -c release --show-bin-path)
          "$BIN/ghostly" version
          "$BIN/ghostly" intent "edit this like marvel and add tiktok captions"
          "$BIN/ghostly" intent "ตัดช่วงเงียบออก ทำเป็นติ๊กต๊อก ใส่คำบรรยาย" | grep -q "removeSilence"
          "$BIN/ghostly" styles
          "$BIN/ghostly" presets
          "$BIN/ghostly" export in.mov --preset TikTok --out out.mp4 | grep -q "scale=1080:1920"
          "$BIN/ghostly" demo-thai | grep -q "captionFormat=ITT.th"
          cat > /tmp/thai.srt <<'EOF'
          1
          00:00:01,000 --> 00:00:03,500
          สวัสดีครับวันนี้เราจะมารีวิวกล้องตัวใหม่

          2
          00:00:04,000 --> 00:00:07,000
          กล้องตัวนี้ถ่ายวิดีโอได้สวยมาก
          EOF
          "$BIN/ghostly" edit /tmp/thai.srt --duration 8 --command "create a tiktok with captions, remove silence" > /tmp/edit.fcpxml
          grep -q "<fcpxml" /tmp/edit.fcpxml
          grep -q "captionFormat=ITT.th" /tmp/edit.fcpxml
          "$BIN/ghostly" validate /tmp/edit.fcpxml
          "$BIN/ghostly" demo-audio --out /tmp/demo.wav
          "$BIN/ghostly" analyze-audio /tmp/demo.wav | tee /tmp/audio.txt
          grep -q "speech: 2 range" /tmp/audio.txt || grep -q "speech: 3 range" /tmp/audio.txt
          grep -q "BPM" /tmp/audio.txt
          "$BIN/ghostly" edit --wav /tmp/demo.wav --command "create a tiktok, remove silence" > /tmp/wav-edit.fcpxml
          grep -q "<fcpxml" /tmp/wav-edit.fcpxml
          "$BIN/ghostly" validate /tmp/wav-edit.fcpxml
          "$BIN/ghostly" edit /tmp/thai.srt --wav /tmp/demo.wav --command "create a tiktok with captions" | grep -q "captionFormat=ITT.th"
          "$BIN/ghostly" edit /tmp/thai.srt --duration 8 --media "/tmp/ฟุตเทจ/คลิป.mov" --command "create a tiktok with captions" > /tmp/media-edit.fcpxml
          grep -q 'src="file:///tmp/' /tmp/media-edit.fcpxml
          ! grep -q 'file:///media/' /tmp/media-edit.fcpxml
          "$BIN/ghostly" validate /tmp/media-edit.fcpxml
          GHOSTLY_HOME=/tmp/ghostly-cli "$BIN/ghostly" workflow --wav /tmp/demo.wav --media "/tmp/คลิป.mov" --command "create a tiktok, remove silence" --out /tmp/wf-media.fcpxml | tee /tmp/wf-media.txt
          grep -q "referenced real media" /tmp/wf-media.txt
          grep -q 'src="file:///tmp/' /tmp/wf-media.fcpxml
          grep -qF "/tmp/คลิป.mov" /tmp/wf-media.txt
          "$BIN/ghostly" extract-audio "คลิป.mp4" | grep -q "pcm_s16le"
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i testsrc=duration=8:size=160x120:rate=10 -i /tmp/demo.wav -shortest -c:v mpeg4 -c:a aac "/tmp/คลิป.mp4"
          "$BIN/ghostly" extract-audio "/tmp/คลิป.mp4" --run --out /tmp/extracted.wav | grep -q "wrote"
          "$BIN/ghostly" analyze-audio /tmp/extracted.wav | grep -q "speech:"
          "$BIN/ghostly" auto "/tmp/คลิป.mp4" --command "ตัดช่วงเงียบออก ทำเป็นติ๊กต๊อก" --out /tmp/auto.fcpxml | tee /tmp/auto.txt
          grep -q 'src="file:///tmp/' /tmp/auto.fcpxml
          grep -q "preset: TikTok" /tmp/auto.txt
          grep -qF "/tmp/คลิป.mp4" /tmp/auto.txt
          "$BIN/ghostly" validate /tmp/auto.fcpxml
          "$BIN/ghostly" analyze-audio /tmp/demo.wav --diarize | grep -q "speakers: 1"
          GHOSTLY_HOME=/tmp/ghostly-cli "$BIN/ghostly" workflow --wav /tmp/demo.wav --command "create a tiktok, remove silence" --remember --out /tmp/wf.fcpxml | tee /tmp/wf.txt
          grep -q "TikTok" /tmp/ghostly-cli/preferences.json
          grep -q "export: ffmpeg" /tmp/wf.txt
          grep -q "preset: TikTok" /tmp/wf.txt
          "$BIN/ghostly" validate /tmp/wf.fcpxml
          "$BIN/ghostly" lut --exposure 0.3 --temperature 0.2 --out /tmp/warm.cube
          "$BIN/ghostly" lut-info /tmp/warm.cube | grep -q "valid 3D cube LUT"
          "$BIN/ghostly" lut --neutralize "0.55 0.45 0.35" --out /tmp/wb.cube
          "$BIN/ghostly" lut-info /tmp/wb.cube | grep -q "valid 3D cube LUT"
          "$BIN/ghostly" normalize-audio /tmp/demo.wav --target -16 --out /tmp/leveled.wav | grep -q "rms:"
          "$BIN/ghostly" normalize-audio /tmp/demo.wav --target -16 --lufs --out /tmp/leveled-lufs.wav | grep -q "lufs:"
          "$BIN/ghostly" analyze-audio /tmp/demo.wav | grep -q "LUFS"
          "$BIN/ghostly" doctor | grep -q "เอนจินหลัก\|พร้อมใช้งานเต็มรูปแบบ"
          printf '1\n00:00:01,000 --> 00:00:20,000\nบทนำ\n\n2\n00:00:40,000 --> 00:01:00,000\nช่วงสอง\n\n3\n00:01:20,000 --> 00:01:40,000\nช่วงสาม\n' > /tmp/ch.srt
          "$BIN/ghostly" chapters /tmp/ch.srt --duration 120 | grep -q "^0:00 "
          "$BIN/ghostly" highlights /tmp/ch.srt --duration 120 | grep -qE "\[(hook|highlight|cta)\]"
          "$BIN/ghostly" clean-audio /tmp/demo.wav --dehum 50 --out /tmp/clean.wav | grep -q "de-hum 50"
          "$BIN/ghostly" analyze-audio /tmp/clean.wav | grep -q "speech:"
          "$BIN/ghostly" analyze-audio /tmp/leveled.wav | grep -q "speech:"

      - name: Smoke-test MCP server handshake
        run: |
          BIN=$(swift build -c release --show-bin-path)
          OUT=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | GHOSTLY_HOME=/tmp/ghostly "$BIN/ghostly-mcp-server")
          echo "$OUT"
          echo "$OUT" | grep -q '"protocolVersion"'
          echo "$OUT" | grep -q '"auto_edit"'
          echo "$OUT" | grep -q '"export_chapters"'

  macos-build:
    name: macOS build & test (full platform incl. SwiftUI)
    runs-on: macos-15
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build all targets
        run: swift build --build-tests

      - name: Test
        run: swift test --parallel

      - name: Package clickable app folder (Ghostly790K-AI-Studio)
        run: |
          bash -n dist/Ghostly790K-AI-Studio/*.command
          swift build -c release --product ghostly
          BIN=$(swift build -c release --show-bin-path)
          PKG=/tmp/pkg/Ghostly790K-AI-Studio
          mkdir -p "$PKG/bin"
          cp -R dist/Ghostly790K-AI-Studio/. "$PKG/"
          cp "$BIN/ghostly" "$PKG/bin/"
          chmod +x "$PKG"/*.command "$PKG/bin/ghostly"
          "$PKG/bin/ghostly" version
          ls -la "$PKG"

      - name: Smoke-test zero-setup auto (native AVFoundation, no ffmpeg)
        run: |
          PKG=/tmp/pkg/Ghostly790K-AI-Studio
          "$PKG/bin/ghostly" demo-audio --out "/tmp/คลิป.wav"
          "$PKG/bin/ghostly" auto "/tmp/คลิป.wav" --command "ตัดช่วงเงียบออก ทำเป็นติ๊กต๊อก" --out /tmp/auto-native.fcpxml | tee /tmp/auto-native.txt
          grep -q "เอนจิน macOS" /tmp/auto-native.txt
          grep -q 'src="file:///tmp/' /tmp/auto-native.fcpxml
          "$PKG/bin/ghostly" validate /tmp/auto-native.fcpxml

      - name: Upload clickable app folder
        uses: actions/upload-artifact@v4
        with:
          name: Ghostly790K-AI-Studio
          path: /tmp/pkg
          if-no-files-found: error
